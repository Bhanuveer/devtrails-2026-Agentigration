version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: gigsure-db
    environment:
      MYSQL_ROOT_PASSWORD: Bhanusql80
      MYSQL_DATABASE: gigsure
      MYSQL_USER: gigsure_user
      MYSQL_PASSWORD: gigsure_pass123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - gigsure-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gigsure-backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: gigsure
      DB_USER: gigsure_user
      DB_PASSWORD: gigsure_pass123
      SECRET_KEY: gigsure2026secretkey
      ALGORITHM: HS256
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-da37264775705601ac4270419c452b80}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gigsure-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gigsure-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gigsure-network
    environment:
      VITE_API_URL: http://backend:8000

volumes:
  db_data:


networks:
  gigsure-network:
    driver: bridge
